name: CD Reference - Build, Scan, Deploy to EKS via ArgoCD (Manual Only)

# This is a REFERENCE ARCHITECTURE for a full GitOps CD pipeline.
# It does not run automatically because it depends on real infrastructure:
#   - SonarQube server with SONAR_TOKEN + SONAR_HOST_URL secrets
#   - AWS account with OIDC role configured (AWS_OIDC_ROLE_ARN secret)
#   - Amazon ECR repository
#   - A separate GitOps manifests repo (GITOPS_REPO_TOKEN secret)
#   - ArgoCD watching the GitOps repo and syncing to Amazon EKS
#
# To run end-to-end, configure the required secrets in repo Settings -> Secrets,
# then trigger manually from the Actions tab.
#
# For day-to-day validation that runs on every push, see ci-validate.yml

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: dileepdevops/sample-app
  EKS_CLUSTER: prod-eks-cluster

jobs:
  # ------------------------------------------------------------------
  # Stage 1: Static analysis - SonarQube
  # ------------------------------------------------------------------
  sonarqube-scan:
    name: SonarQube Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for SonarQube blame analysis

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ------------------------------------------------------------------
  # Stage 2: Build Docker image and push to ECR
  # ------------------------------------------------------------------
  build-and-push:
    name: Build Docker Image and Push to ECR
    runs-on: ubuntu-latest
    needs: sonarqube-scan
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}-$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Build and tag Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.meta.outputs.tag }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -f docker/Dockerfile .
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

      - name: Push image to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.meta.outputs.tag }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

  # ------------------------------------------------------------------
  # Stage 3: Container vulnerability scanning - Trivy
  # ------------------------------------------------------------------
  trivy-scan:
    name: Trivy Container Image Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Run Trivy scan on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-push.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # fail the pipeline if CRITICAL/HIGH CVEs found

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ------------------------------------------------------------------
  # Stage 4: Update GitOps manifest -> ArgoCD auto-syncs to EKS
  # ------------------------------------------------------------------
  update-gitops-manifest:
    name: Update Kubernetes Manifest for ArgoCD Sync
    runs-on: ubuntu-latest
    needs: [build-and-push, trivy-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout GitOps manifests repo
        uses: actions/checkout@v4
        with:
          repository: dp529/dileepdevops-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      - name: Update image tag in Kubernetes manifest
        run: |
          cd gitops/environments/prod
          sed -i "s|image: .*|image: ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-push.outputs.image-tag }}|" deployment.yaml

      - name: Commit and push manifest update
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "ci: update prod image to ${{ needs.build-and-push.outputs.image-tag }}"
          git push

      # ArgoCD watches the gitops repo and auto-syncs the change to EKS
